<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El bes de Rosaura</title>
    <link rel="stylesheet" href="../../style.css">
</head>
<body>
    <div id="barra"></div>

    <main class="main-container">
        <h1 class="titulo">El bes de Rosaura</h1>
        <h2 class="hecho">Fet per Oliver Muñoz Dimas, Comenius Centre Educatiu.</h2>

        <section class="descripcion">
            <h3>En este apartat del meu web trobaràs els vídeos i enllaços de les cançons seleccionades per al projecte del grup de: <strong>Oliver, Adrián i Galo</strong>.</h3>
        </section>

        <section class="contenido">
            <div class="enlaces">
                <h3>La Oreja de Van Gogh - Rosas</h3>
                <div class="video-responsive">
                    <iframe src="https://www.youtube.com/embed/nYnLVWXmRm8?si=fYPwtA288FUZYIVv" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
                </div>
                <a href="https://youtu.be/nYnLVWXmRm8?si=iblMRcHFzOjtL7H8" class="btn-youtube" target="_blank">Ver en Youtube</a>
            </div>
        </section>
    </main>

    <script>
        const contenedor = document.getElementById('barra');
        fetch('../barra.html')
          .then(respuesta => {
            if (!respuesta.ok) throw new Error("No se pudo cargar la barra");
            return respuesta.text();
          })
          .then(html => { contenedor.innerHTML = html; })
          .catch(error => console.error('Error:', error));
    </script>
</body>
</html>
